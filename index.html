<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The  Javawockee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="topbar">
            <h1 class="brand"><a href="index.html">The Javawockee</a></h1>
            <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
            <nav>
                <ul class="nav" id="siteNav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="merch.html">Merch</a></li>
                    <li><a href="games.html">Games</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <h2>Welcome</h2>
            <p class="lead">This site showcases projects, games and media. It's a work in progress — thank you for visiting.</p>
            <div class="hero-actions">
                <button id="helloBtn" class="btn btn-primary">Try Demo</button>
                <button id="showFormBtn" class="btn btn-outline">Give Feedback</button>
            </div>
        </section>

        <section id="music-controls" class="controls" aria-label="Music controls">
            <h3>MUSIC</h3>
            <div id="audioControls"></div>
        </section>

        <div id="customModal" class="modal">
            <div class="modal-content">
                <button class="close" id="closeModal" aria-label="Close">&times;</button>
                <img id="vaderImg" src="https://www.pngall.com/wp-content/uploads/9/Darth-Vader-PNG-File-Download-Free.png" alt="Darth Vader" class="modal-figure">
                <p>The Force is strong with this one!</p>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 The Javawockee</p>
    </footer>
    <script src="script.js"></script>
    <script>
        // Show/hide Google Form on button click
        document.getElementById('showFormBtn').onclick = function() {
            const formDiv = document.getElementById('googleFormContainer');
            if (!formDiv) return;
            formDiv.style.display = formDiv.style.display === 'none' ? 'block' : 'none';
        };

        // Modal demo with animation
        const helloBtn = document.getElementById('helloBtn');
        const modal = document.getElementById('customModal');
        const closeModal = document.getElementById('closeModal');
        helloBtn && helloBtn.addEventListener('click', () => {
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        });
        closeModal && closeModal.addEventListener('click', () => {
            modal.classList.remove('open');
            document.body.style.overflow = '';
        });
        modal && modal.addEventListener('click', (e) => { if (e.target === modal) { modal.classList.remove('open'); document.body.style.overflow = ''; } });

        // Mobile nav toggle
        const navToggle = document.getElementById('navToggle');
        const siteNav = document.getElementById('siteNav');
        navToggle && navToggle.addEventListener('click', () => {
            const expanded = navToggle.getAttribute('aria-expanded') === 'true';
            navToggle.setAttribute('aria-expanded', String(!expanded));
            siteNav.classList.toggle('open');
        });

        // Page reveal on load
        document.addEventListener('DOMContentLoaded', () => {
            const mainEl = document.querySelector('main');
            requestAnimationFrame(() => mainEl && mainEl.classList.add('revealed'));
        });

        // Link navigation with fade-out
        document.querySelectorAll('a[href]').forEach((a) => {
            const href = a.getAttribute('href');
            // Only intercept same-origin HTML links
            if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('http')) return;
            a.addEventListener('click', (e) => {
                e.preventDefault();
                const mainEl = document.querySelector('main');
                mainEl && mainEl.classList.add('page-exit');
                setTimeout(() => { window.location.href = href; }, 300);
            });
        });
    </script>
</body>
</html>
